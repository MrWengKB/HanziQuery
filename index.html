<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小学华文识读字查询系统</title>
  <!-- 引入样式文件 -->
  <link rel="stylesheet" href="style.css?v=4">
  <!-- PWA：可添加到主屏幕、离线使用 -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#f8fafc">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="识读字查询">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>
<body>

<div class="container">
  <header>
    <h1>小学华文识读字查询系统</h1>
    <h2>目前收录一至三年级新教材（《欢乐伙伴2.0》）的识读字。接下来每出一本新教材都会尽快更新。</h2>
    <h2>发音音频来自 <a href="https://github.com/hugolpz/audio-cmn/" target="_blank">hugolpz/audio-cmn</a> (CC-by-sa)</h2>
    <!-- 动态读取同目录 hanzilist.csv ，支持多音字多拼音展示、多字母智能筛选与综合检索 -->

  </header>

  <!-- 备用导入提示条 -->
  <div class="notice-bar" id="noticeBar">
    <span id="noticeMsg">提示：若直接双击HTML打开受浏览器安全限制未能自动读取CSV，可点右侧手动指定同目录下的 hanzilist.csv：</span>
    <button class="notice-btn" onclick="document.getElementById('csvFileInput').click()">选择 hanzilist.csv</button>
    <input type="file" id="csvFileInput" accept=".csv" style="display:none" onchange="handleFileSelect(event)">
  </div>

  <!-- 筛选控件区域 -->
  <div class="filter-card">
    <div class="search-row">
      <input type="text" id="searchInput" class="search-input" placeholder="输入汉字或任一拼音搜索 (如: 长、chang、zhang、er)..." autocomplete="off">
    </div>

    <div class="filters-grid">
      <div class="filter-group">
        <label for="gradeFilter">年级</label>
        <select id="gradeFilter">
          <option value="">全部年级</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="lessonFilter">课次</label>
        <select id="lessonFilter">
          <option value="">全部课次</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="structFilter">汉字结构</label>
        <select id="structFilter">
          <option value="">全部结构</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="initialFilter">拼音首字母</label>
        <select id="initialFilter">
          <option value="">全部首字母 (A-Z)</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="radicalFilter">部首</label>
        <select id="radicalFilter">
          <option value="">全部部首</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="strokeFilter">笔画数</label>
        <select id="strokeFilter">
          <option value="">全部笔画</option>
        </select>
      </div>
    </div>

    <div class="btn-row">
      <div class="stats">
        共找到 <span id="matchCount">0</span> 个生字（总库 <span id="totalCount">0</span> 字）
      </div>
      <button class="reset-btn" id="resetBtn" type="button">重置所有筛选</button>
    </div>
  </div>

  <!-- 卡片列表渲染区域 -->
  <div class="results-grid" id="charGrid"></div>
</div>

<!-- 汉字详情弹窗 -->
<div class="modal-overlay" id="charModal">
  <div class="modal-content">
    <button class="modal-close" id="modalClose">&times;</button>
    <div class="modal-char-view">
      <div class="modal-pinyin" id="modalPinyin"></div>
      <div class="modal-char-big" id="modalChar"></div>
      <button type="button" class="oracle-toggle" id="oracleToggle" aria-pressed="false">甲骨文</button>
    </div>
    <div class="modal-details">
      <div class="detail-item">
        <span class="detail-label">年级</span>
        <span class="detail-value" id="modalGrade"></span>
      </div>
      <div class="detail-item">
        <span class="detail-label">课次</span>
        <span class="detail-value" id="modalLesson"></span>
      </div>
      <div class="detail-item">
        <span class="detail-label">汉字结构</span>
        <span class="detail-value" id="modalStruct"></span>
      </div>
      <div class="detail-item">
        <span class="detail-label">部首</span>
        <span class="detail-value" id="modalRadical"></span>
      </div>
      <div class="detail-item">
        <span class="detail-label">笔画数</span>
        <span class="detail-value" id="modalStrokes"></span>
      </div>
      <div class="detail-item">
        <span class="detail-label">拼音字母</span>
        <span class="detail-value" id="modalInitial"></span>
      </div>
    </div>
  </div>
</div>

<!-- 模块化引入 JS 脚本（注意引入顺序：工具/弹窗优先，入口 app 随后） -->
<script src="js/parser.js?v=4"></script>
<script src="js/modal.js?v=4"></script>
<script src="js/app.js?v=4"></script>
<!-- 注册离线缓存（安卓 App 里已自带离线文件，不需要注册） -->
<script>
  if ('serviceWorker' in navigator && location.hostname !== 'appassets.androidplatform.net') {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
  }
</script>

</body>
</html>
