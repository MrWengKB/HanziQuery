name: 构建安卓 APK 和 AAB

on:
  push:
    branches: [main]
    paths:
      - version-history.md
      - android/**
      - .github/workflows/build-android.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: 准备签名密钥（来自 GitHub Secrets）
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            {
              echo "HQ_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks"
              echo "HQ_KEYSTORE_PASSWORD=$KS_PW"
              echo "HQ_KEY_ALIAS=$KEY_ALIAS"
              echo "HQ_KEY_PASSWORD=$KEY_PW"
            } >> "$GITHUB_ENV"
            echo "使用 GitHub Secrets 里的上传密钥"
          else
            echo "::warning::还没有设置 ANDROID_KEYSTORE_BASE64，暂时使用仓库里的旧密钥"
          fi

      - name: 编译 APK 和 AAB
        working-directory: android
        run: gradle assembleDirectRelease bundlePlayRelease --no-daemon

      - name: 重命名
        run: |
          cp android/app/build/outputs/apk/direct/release/app-direct-release.apk HanziQuery.apk
          cp android/app/build/outputs/bundle/playRelease/app-play-release.aab HanziQuery.aab
          ls -la HanziQuery.apk HanziQuery.aab

      - name: 保存为构建产物
        uses: actions/upload-artifact@v4
        with:
          name: HanziQuery-android
          path: |
            HanziQuery.apk
            HanziQuery.aab

      - name: 发布到 Releases（APK 和 AAB 分开，可直接下载）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 取 version-history.md 的第一段（最新版本）写进发布说明，App 的更新提醒就显示这一段
          awk '/^[[:space:]]*#/{n++} n==1' version-history.md > latest-notes.md
          VERSION=$(grep -oE '[vV][0-9]+(\.[0-9]+)*' latest-notes.md | head -1)
          {
            echo "第 ${{ github.run_number }} 次构建。"
            echo
            echo "- **HanziQuery.apk**：手机直接下载安装（需要允许安装未知来源应用），完全离线可用。"
            echo "- **HanziQuery.aab**：上架 Google Play 用，手机不能直接安装（Play 版不含自动检查更新，由 Play 商店负责更新）。"
            echo
            cat latest-notes.md
          } > release-notes.md

          gh release delete apk-latest --cleanup-tag -y || true
          gh release create apk-latest HanziQuery.apk HanziQuery.aab \
            --title "识读字查询 ${VERSION:-（最新）}" \
            --notes-file release-notes.md \
            --latest
