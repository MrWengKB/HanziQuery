name: 构建安卓 APK

on:
  push:
    branches: [main]
    paths:
      - version-history.md
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: 编译 APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: 重命名 APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk HanziQuery.apk

      - name: 保存为构建产物
        uses: actions/upload-artifact@v4
        with:
          name: HanziQuery-apk
          path: HanziQuery.apk

      - name: 发布到 Releases（手机可直接下载）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 取 version-history.md 的第一段（最新版本）写进发布说明，App 的更新提醒就显示这一段
          awk '/^[[:space:]]*#/{n++} n==1' version-history.md > latest-notes.md
          VERSION=$(grep -oE '[vV][0-9]+(\.[0-9]+)*' latest-notes.md | head -1)
          {
            echo "第 ${{ github.run_number }} 次构建。下载 HanziQuery.apk 安装即可离线使用。"
            echo
            cat latest-notes.md
          } > release-notes.md

          gh release delete apk-latest --cleanup-tag -y || true
          gh release create apk-latest HanziQuery.apk \
            --title "识读字查询 ${VERSION:-（最新）}" \
            --notes-file release-notes.md \
            --latest
